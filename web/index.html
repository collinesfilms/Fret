<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 is here for one reason: iOS Safari zooms the page in
      whenever you focus an input whose type is under 16px, and does not zoom
      back out afterwards. Fret's fields are at --m5, deliberately, because a
      16px field beside 7.5px labels is the loudest thing on the screen and it
      is not the point. Safari has ignored this hint for pinch since iOS 10,
      so a closer look is still a closer look — it only declines the
      uninvited one.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      Rewritten from the resolved palette on every theme change (App.tsx).
      Without it Safari tints its own bars by sampling the page and lands on
      something close to but not the background, which is what put a seam
      across the top and bottom of the screen on a phone.
    -->
    <meta name="theme-color" content="#f0eeea" />
    <title>Fret</title>

    <!--
      The icon is an SVG, drawn like every other mark here. The PNGs beside it
      exist only because a home screen reads its icon out of a raster file;
      they are generated from the SVG by `npm run icons`, never hand-edited.

      Shipping one at all is the point: without a favicon a browser keeps
      showing whatever it last cached for the domain, which on a NAS running
      several apps behind one host means Fret wearing somebody else's mark.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Served by the API rather than shipped as a file: the app's name is set
      by FRET_APP_NAME, and a static manifest would install a renamed instance
      to the home screen still calling itself Fret.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so a dark-mode reload never
      // flashes the light palette. The server-stored preference arrives with
      // /api/me a moment later and takes over from here.
      (function () {
        try {
          var stored = localStorage.getItem('fret.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
